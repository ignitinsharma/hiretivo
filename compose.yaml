services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hiretivo
      POSTGRES_PASSWORD: ${HIRETIVO_DB_PASSWORD:?Run ./scripts/local-up.sh}
      POSTGRES_DB: hiretivo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiretivo -d hiretivo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://hiretivo:${HIRETIVO_DB_PASSWORD:?Run ./scripts/local-up.sh}@db:5432/hiretivo
      AUTH_SECRET: ${HIRETIVO_AUTH_SECRET:?Run ./scripts/local-up.sh}
      HIRETIVO_ENCRYPTION_KEY: ${HIRETIVO_ENCRYPTION_KEY:?Run ./scripts/local-up.sh}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SELF_HOSTED: "true"
      NEXT_PUBLIC_SHOW_COMING_SOON: "false"
      HIRETIVO_FILES_DIR: /app/data/files
    volumes:
      - uploaded_files:/app/data/files
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_files:
