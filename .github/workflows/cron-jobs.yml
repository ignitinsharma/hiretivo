name: ATS Cron Jobs

on:
  schedule:
    - cron: '0 9 * * *'   # Ashby — 09:00 UTC daily
    - cron: '15 9 * * *'  # Greenhouse — 09:15 UTC daily
    - cron: '30 9 * * *'  # Lever — 09:30 UTC daily
    - cron: '30 0 * * *'  # Cleanup — 00:30 UTC daily (CLOSED>30d delete, no Verce cron)

jobs:
  ashby:
    if: github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ashby fetch
        run: |
          curl -sfL -w "\nHTTP_CODE:%{http_code}\n" -X GET "${{ secrets.PROD_URL }}/api/cron/ats-fetch/ashby" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  greenhouse:
    if: github.event.schedule == '15 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Greenhouse fetch
        run: |
          curl -sfL -w "\nHTTP_CODE:%{http_code}\n" -X GET "${{ secrets.PROD_URL }}/api/cron/ats-fetch/greenhouse" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  lever:
    if: github.event.schedule == '30 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Lever fetch
        run: |
          curl -sfL -w "\nHTTP_CODE:%{http_code}\n" -X GET "${{ secrets.PROD_URL }}/api/cron/ats-fetch/lever" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  cleanup:
    if: github.event.schedule == '30 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ATS cleanup (CLOSED>30d delete)
        run: |
          curl -sfL -w "\nHTTP_CODE:%{http_code}\n" -X GET "${{ secrets.PROD_URL }}/api/cron/ats-cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
