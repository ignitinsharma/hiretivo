name: ATS Cron Jobs

on:
  schedule:
    - cron: '0 0 * * *'   # Ashby      — 00:00 UTC daily
    - cron: '15 0 * * *'  # Greenhouse — 00:15 UTC daily
    - cron: '30 0 * * *'  # Lever      — 00:30 UTC daily
    - cron: '0 3 * * 0'   # Cleanup    — 03:00 UTC every Sunday

jobs:
  ashby:
    if: github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ashby fetch
        run: |
          curl -sf -X GET "${{ secrets.PROD_URL }}/api/cron/ats-ashby" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  greenhouse:
    if: github.event.schedule == '15 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Greenhouse fetch
        run: |
          curl -sf -X GET "${{ secrets.PROD_URL }}/api/cron/ats-greenhouse" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  lever:
    if: github.event.schedule == '30 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Lever fetch
        run: |
          curl -sf -X GET "${{ secrets.PROD_URL }}/api/cron/ats-lever" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  cleanup:
    if: github.event.schedule == '0 3 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ATS cleanup
        run: |
          curl -sf -X GET "${{ secrets.PROD_URL }}/api/cron/ats-cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
