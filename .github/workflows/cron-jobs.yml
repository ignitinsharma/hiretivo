name: ATS Cron Jobs

on:
  schedule:
    - cron: '0 9 * * *'   # Ashby+Lever — 09:00 UTC daily (Hobby 2-cron split)
    - cron: '15 9 * * *'  # Greenhouse — 09:15 UTC daily
    - cron: '30 0 * * *'  # Cleanup — 00:30 UTC daily (CLOSED>30d delete, no Verce cron)

jobs:
  ashby-lever:
    if: github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ashby+Lever fetch (Hobby-safe combined)
        run: |
          curl -sfL -X GET "${{ secrets.PROD_URL }}/api/cron/ats-fetch/ashby-lever" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  greenhouse:
    if: github.event.schedule == '15 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Greenhouse fetch
        run: |
          curl -sfL -X GET "${{ secrets.PROD_URL }}/api/cron/ats-fetch/greenhouse" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  cleanup:
    if: github.event.schedule == '30 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ATS cleanup (CLOSED>30d delete)
        run: |
          curl -sfL -X GET "${{ secrets.PROD_URL }}/api/cron/ats-cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
